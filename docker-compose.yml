services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eprint-app
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:80"
    volumes:
      - storage_data:/var/www/storage

  db:
    image: mysql:8.0
    container_name: eprint-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: news
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  storage_data:
  mysql_data: