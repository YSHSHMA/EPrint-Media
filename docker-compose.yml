services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: eprint-app

    restart: unless-stopped

    ports:
      - "8000:80"

    environment:
      APP_NAME: EPrint-Media
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://eprint-media.dockhosting.dev

      DB_CONNECTION: mysql
      DB_HOST: db-eprint-media-db-6aa6f46a
      DB_PORT: 3306
      DB_DATABASE: eprint-media-db
      DB_USERNAME: dbuser
      DB_PASSWORD: ${DB_PASSWORD}

    volumes:
      - storage_data:/var/www/storage

volumes:
  storage_data: